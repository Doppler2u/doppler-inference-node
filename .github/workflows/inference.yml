name: Scheduled Inference Worker

on:
  schedule:
    # Runs every 48 hours at midnight
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests schedule

      - name: Reconstruct Identity File
        run: |
          echo "${{ secrets.IDENTITY_PEM_BASE64 }}" | base64 --decode > identity.pem
          
      - name: Run Inference Job
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          IDENTITY_PATH: identity.pem
        run: |
          python worker.py
