name: Airdrop Farmer
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - name: Reconstruct Identity File
        run: |
          echo "${{ secrets.IDENTITY_PEM_BASE64 }}" | base64 --decode > identity.pem
      - run: node worker.mjs
        env:
          PASSPHRASE: "${{ secrets.PASSPHRASE }}"
          IDENTITY_PATH: identity.pem
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
